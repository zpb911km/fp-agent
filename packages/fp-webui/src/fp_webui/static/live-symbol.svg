<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-label="FP">
  <defs>
    <style>
      /* ─── 外壳 —— 缓慢起伏 ─── */
      .sym-hull {
        animation: hullPulse 6s ease-in-out infinite;
      }
      @keyframes hullPulse {
        0%, 100% { opacity: 0.45; stroke-width: 1.3; }
        50%      { opacity: 0.65; stroke-width: 1.5; }
      }

      /* ─── 断裂环 —— 逆时针自转 ─── */
      .sym-ring {
        transform-origin: 24px 24px;
        animation: ringSpin 20s linear infinite;
      }
      @keyframes ringSpin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      /* ─── 辐射线 —— 脉冲呼吸 ─── */
      .sym-rays {
        animation: raysPulse 4s ease-in-out infinite;
      }
      @keyframes raysPulse {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 0.55; }
      }

      /* ─── 断裂线 —— 偶尔闪烁 ─── */
      .sym-broken {
        animation: brokenFlicker 8s ease-in-out infinite;
      }
      @keyframes brokenFlicker {
        0%, 85%, 100% { opacity: 0.1; stroke-width: 0.6; }
        90%           { opacity: 0.6; stroke-width: 1.4; }
        95%           { opacity: 0.2; stroke-width: 0.8; }
      }

      /* ─── 核心 —— 稳定呼吸发光 ─── */
      .sym-core {
        transform-origin: 24px 24px;
        animation: coreBreathe 3s ease-in-out infinite;
      }
      @keyframes coreBreathe {
        0%, 100% { opacity: 0.08; transform: scale(1); }
        50%      { opacity: 0.18; transform: scale(1.03); }
      }

      /* ─── 中心光点 —— 明暗微动 ─── */
      .sym-dot {
        transform-origin: 24px 24px;
        animation: dotGlow 3s ease-in-out infinite;
      }
      @keyframes dotGlow {
        0%, 100% { opacity: 0.5; r: 2.5; }
        50%      { opacity: 0.9; r: 3; }
      }
    </style>
  </defs>

  <!-- 腔室外壳 —— 六边形结构 -->
  <polygon class="sym-hull" points="24,2 44,13 44,35 24,46 4,35 4,13"
           fill="none" stroke="#8b3a3a" stroke-width="1.3" opacity="0.45"/>
  <!-- 断裂的数据环流 -->
  <circle class="sym-ring" cx="24" cy="24" r="13"
          fill="none" stroke="#a65e2e" stroke-width="1"
          stroke-dasharray="3 4" opacity="0.5"/>
  <!-- 辐射连接线 —— 6 条，其中一条断裂 -->
  <g class="sym-rays" fill="none" stroke="#a65e2e" stroke-width="0.8" opacity="0.35">
    <line x1="24" y1="24" x2="24" y2="4"/>
    <line x1="24" y1="24" x2="42" y2="14"/>
    <line x1="24" y1="24" x2="42" y2="36"/>
    <line x1="24" y1="24" x2="24" y2="46"/>
    <line x1="24" y1="24" x2="6" y2="36"/>
    <!-- 断裂的第六条 —— 偏移 + 虚线 -->
    <line class="sym-broken" x1="24" y1="24" x2="8" y2="14"
          stroke="#8b3a3a" stroke-width="0.8"
          stroke-dasharray="2 3" opacity="0.25"/>
  </g>
  <!-- 核心处理器 —— 菱形 -->
  <polygon class="sym-core" points="24,13 33,24 24,35 15,24"
           fill="#a65e2e" opacity="0.08"
           stroke="#8b3a3a" stroke-width="1.2"/>
  <!-- 核心发光点 -->
  <circle class="sym-dot" cx="24" cy="24" r="2.5"
          fill="#a65e2e" opacity="0.7"/>
</svg>
