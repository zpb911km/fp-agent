[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-core"
dynamic = ["version"]
description = "FP Agent 引擎 - 基于生命周期钩子的插件化 Agent 核心"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "zpb"}]
keywords = ["agent", "llm", "lifecycle", "plugin", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 会话关键词（KL 管线）用的中文分词器。缺失时自动退化为 bigram，
# 功能不中断、只是词边界更粗——所以不做硬依赖。
kw = ["jieba>=0.42"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fp_core*"]

[tool.setuptools.package-data]
"fp_core" = ["*.md", "*.json", "*.yaml", "*.yml"]

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"
write_to = "src/fp_core/_version.py"

[tool.pytest.ini_options]
# 本仓库测试自洽：src 优先于 editable（editable 默认在旧仓库）
pythonpath = ["src"]
