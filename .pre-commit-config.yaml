# pre-commit 配置
# 安装: pre-commit install
# 手动运行: pre-commit run --all-files
# 跳过钩子提交: git commit --no-verify
#
# 注意: 使用 repo: local + language: system 避免 GitHub 网络依赖

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        require_serial: true

      # 文档同步门禁：改了代码而相关文档没同步 → 提醒并阻断提交。
      # 逻辑在 scripts/check_docs_sync.py（基于 git 变更流判定，非文本比对）。
      # 手动主动触发: python scripts/check_docs_sync.py --since HEAD~N
      # 显式放行:      FP_DOCS_SYNC_ALLOW=1 git commit
      - id: docs-sync
        name: docs sync check
        entry: python scripts/check_docs_sync.py
        language: system
        require_serial: true
        pass_filenames: false
        files: ^(packages/fp-core/src/|packages/fp/src/|packages/fp-terminal/|packages/fp-webui/|packages/fp-acp/|docs/|README\.md|scripts/)
