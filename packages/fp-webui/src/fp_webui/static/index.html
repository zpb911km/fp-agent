<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Five Pebbles · WebUI</title>

<link rel="icon" type="image/png" href="/static/favicon.png">

<!-- 样式 -->
<link rel="stylesheet" href="/static/style.css?_t=20260729v5">

<!-- Markdown 渲染 -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js" defer></script>
<!-- DOMPurify HTML 清洗（防 XSS） -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" defer></script>
<!-- KaTeX 公式渲染 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body class="crt-flicker">

  <!-- ═══ 装饰层 ═══ -->

  <!-- ─── 光环背景（弹性稳态环系统） ─── -->
  <div id="halo-bg" data-state="idle" aria-hidden="true">
    <svg id="halo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <style>
        .h-glow   { fill: none; stroke-linecap: round; }
        .h-sparse { fill: none; stroke-linecap: butt; opacity: 0.8; }
        .h-ring   { fill: none; opacity: 0.6; }
        .h-paired { fill: none; stroke-linecap: butt; opacity: 0.8; }
        .h-dense  { fill: none; stroke-linecap: butt; opacity: 0.8; }
        .h-sparse, .h-paired, .h-dense { transform-origin: 200px 200px; }

        .h-glow   { animation: flicker-glow 6s infinite; }
        .h-sparse { animation: flicker-sparse 10s infinite, rotate-sparse 46s infinite; }
        .h-ring   { animation: flicker-ring 14s infinite; }
        .h-paired { animation: flicker-paired 22s infinite, rotate-paired 58s infinite; }
        .h-dense  { animation: flicker-dense 26s infinite, rotate-dense 62s infinite; }

        @keyframes flicker-glow { 0%,100%{opacity:.4} 42%{opacity:.4} 43%{opacity:0} 44%{opacity:.4} 45%{opacity:.1} 46%{opacity:.4} 78%{opacity:.4} 79%{opacity:0} 80%{opacity:.4} }
        @keyframes flicker-sparse { 0%,100%{opacity:.8} 30%{opacity:.8} 31%{opacity:0} 32%{opacity:.8} 33%{opacity:.1} 34%{opacity:.8} 65%{opacity:.8} 66%{opacity:0} 67%{opacity:.8} }
        @keyframes flicker-ring { 0%,100%{opacity:.6} 53%{opacity:.6} 54%{opacity:0} 55%{opacity:.6} 89%{opacity:.6} 90%{opacity:.1} 91%{opacity:.6} }
        @keyframes flicker-paired { 0%,100%{opacity:.8} 23%{opacity:.8} 24%{opacity:0} 25%{opacity:.8} 26%{opacity:.1} 27%{opacity:.8} 61%{opacity:.8} 62%{opacity:0} 63%{opacity:.8} }
        @keyframes flicker-dense { 0%,100%{opacity:.8} 17%{opacity:.8} 18%{opacity:0} 19%{opacity:.8} 47%{opacity:.8} 48%{opacity:.1} 49%{opacity:.8} 73%{opacity:.8} 74%{opacity:0} 75%{opacity:.8} }

        @keyframes rotate-sparse { 0%,10%{transform:rotate(0deg)} 10%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 20%{transform:rotate(60deg)} 20%,30%{transform:rotate(60deg)} 30%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 45%{transform:rotate(120deg)} 45%,60%{transform:rotate(120deg)} 60%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 75%{transform:rotate(240deg)} 75%,90%{transform:rotate(240deg)} 90%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 100%{transform:rotate(360deg)} }
        @keyframes rotate-paired { 0%,15%{transform:rotate(0deg)} 15%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 25%{transform:rotate(-90deg)} 25%,40%{transform:rotate(-90deg)} 40%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 55%{transform:rotate(-180deg)} 55%,70%{transform:rotate(-180deg)} 70%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 85%{transform:rotate(-270deg)} 85%,95%{transform:rotate(-270deg)} 95%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 100%{transform:rotate(-360deg)} }

        @keyframes rotate-dense { 0%,5%{transform:rotate(0deg)} 5%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 15%{transform:rotate(45deg)} 15%,25%{transform:rotate(45deg)} 25%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 35%{transform:rotate(90deg)} 35%,50%{transform:rotate(90deg)} 50%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 65%{transform:rotate(180deg)} 65%,80%{transform:rotate(180deg)} 80%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 90%{transform:rotate(270deg)} 90%,95%{transform:rotate(270deg)} 95%{animation-timing-function:cubic-bezier(.4,0,.2,1)} 100%{transform:rotate(360deg)} }
      </style>
      <g filter="url(#ringGlow)">
        <circle id="l2" class="h-glow" cx="200" cy="200" r="41" stroke-width="82" stroke="#8fb3a6"/>
        <circle id="l3" class="h-sparse" cx="200" cy="200" r="122" stroke-width="10" pathLength="360" stroke-dasharray="1.1 18.9" stroke="#cfe7df"/>
        <circle id="l4" class="h-ring" cx="200" cy="200" r="137" stroke-width="2" stroke="#bfe0d6"/>
        <circle id="l5" class="h-paired" cx="200" cy="200" r="157" stroke-width="12" pathLength="360" stroke-dasharray="1 2.6 1 19.4" stroke="#d6ece4"/>
        <circle id="l6" class="h-dense" cx="200" cy="200" r="177" stroke-width="8" pathLength="360" stroke-dasharray="0.65 4.35" stroke="#c4e0d8"/>
      </g>
    </svg>
  </div>

  <!-- ═══ 登录遮罩层 ═══ -->
  <div class="auth-overlay" id="authOverlay" role="dialog" aria-label="登录验证">
    <div class="auth-box">
      <h1>Five Pebbles</h1>
      <p>请输入启动 Token 以连接</p>
      <div class="token-hint">
        ⚠ Token 在服务器启动时打印在终端中<br>
        或查看项目根目录的 <code style="color:var(--yellow);background:transparent;padding:0">.webui_token</code> 文件
      </div>
      <input type="password" class="auth-input" id="authInput"
             placeholder="ENTER_ACCESS_TOKEN..."
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="Token 输入框"
             onkeydown="if(event.key==='Enter') doLogin()">
      <button class="auth-btn" id="authBtn" onclick="doLogin()" aria-label="连接">
        🔓 连接
      </button>
      <div class="auth-error" id="authError" role="alert">⛔ Token 无效，请重试</div>
    </div>
  </div>

  <!-- ═══ 主应用 ═══ -->
  <div class="app-container">

    <!-- ─── 顶栏 ─── -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <span class="logo">
          <span class="logo-full"><span>Five</span> Pebbles</span>
          <span class="logo-short"><span>F</span>P</span>
        </span>
        <span class="model-badge" id="modelBadge" aria-label="当前模型">—</span>
      </div>
      <div class="topbar-right">
        <span class="session-label" id="sessionLabel" title="当前会话" aria-label="当前会话">—</span>
        <button class="topbar-btn" onclick="openSessions()" title="历史会话" aria-label="打开历史会话列表">
          <span aria-hidden="true">📋</span><span class="btn-label"> 会话</span>
        </button>
        <button class="topbar-btn" onclick="newAgent()" title="新建 Agent（shutdown 旧实例，创建全新实例和会话）" aria-label="新建 Agent">
          <span aria-hidden="true">🆕</span><span class="btn-label"> 新建</span>
        </button>
        <button class="topbar-btn" onclick="reloadAgent()" title="热重载 Agent（不重启服务器，加载修改后的代码）" aria-label="热重载 Agent">
          <span aria-hidden="true">🔄</span><span class="btn-label"> 重载</span>
        </button>
        <button class="topbar-btn danger" onclick="clearSession()" title="清空当前会话" aria-label="清空当前会话">
          <span aria-hidden="true">🗑️</span><span class="btn-label"> 清空</span>
        </button>
        <button class="topbar-btn theme-btn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题" id="themeBtn">
          <span aria-hidden="true">☀️</span>
        </button>
      </div>
    </header>

    <!-- ─── 消息列表 ─── -->
    <main class="messages-container" id="messagesContainer" role="log" aria-label="聊天消息" aria-live="polite"></main>
    <!-- ─── 输入区 ─── -->
    <div class="input-area" role="form" aria-label="消息输入">
      <div class="input-wrapper">

        <button class="cmd-btn" id="cmdBtn" onclick="toggleCmdPalette()" title="快捷命令 (Ctrl+/)" aria-label="快捷命令" type="button">⚡</button>
        <div class="input-console">
          <textarea id="inputField" class="input-field" rows="1"
                    placeholder="输入指令..."
                    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                    aria-label="输入消息"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                    onfocus="handleInputFocus()"></textarea>
        </div>

        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送 (Enter)" aria-label="发送消息">
          ➤
        </button>
      </div>
      <!-- 快捷命令浮层 -->
      <div class="cmd-palette" id="cmdPalette" role="listbox" aria-label="快捷命令" hidden>
        <div class="cmd-palette-header">⚡ 快捷命令</div>
        <div class="cmd-palette-list" id="cmdList"></div>
      </div>
      <div class="input-hint">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行</span>
        <span id="connectionStatus" aria-live="polite"><span style="color:var(--green-bright)">🟢</span> 已连接</span>
      </div>
      <!-- ─── 状态栏 ─── -->
      <div class="status-bar">
        <span class="status-item latency" id="sbLatency">⏱ —</span>
        <span class="status-item tools" id="sbTools">⚙ 0</span>
        <span class="status-item msgs" id="sbMsgs">✎ 0</span>
        <span class="status-item state" id="sbState">○ idle</span>
      </div>
    </div>
  </div>

  <!-- ═══ 会话列表浮层 ═══ -->
  <div class="modal-overlay" id="sessionsModal" role="dialog" aria-label="历史会话列表">
    <div class="modal">
      <div class="modal-drag-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <span class="modal-title">📋 历史会话</span>
        <button class="modal-close" onclick="closeSessions()" aria-label="关闭会话列表">✕</button>
      </div>
      <div class="modal-body" id="sessionsList">
        <div class="no-sessions">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       脚本加载（顺序重要：ui.js → app.js）
       ════════════════════════════════════════ -->
  <script src="/static/ui.js?_t=20260729v4"></script>
  <script src="/static/app.js?_t=20260729v4"></script>
</body>
</html>
